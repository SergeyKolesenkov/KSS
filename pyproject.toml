[tool.poetry]
name = "mysite"
version = "0.1.0"
description = "Django-приложение"
authors = ["SergeyKolesenkov <kolesenkovs@bk.ru>"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"  # Более стабильная версия Python
django = ">=6.0.5,<7.0.0"
djangorestframework = ">=3.17.1,<4.0.0"
pillow = ">=12.2.0,<13.0.0"
gunicorn = ">=26.0.0,<27.0.0"
django-debug-toolbar = "==6.3.0"
django-filter = "==25.2"
drf-spectacular = "^0.29.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
drf_spectacular = ">=0.27.0,<1.0.0"